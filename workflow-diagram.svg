<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .shadow { filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.06)); }
      .card-shadow { filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.04)); }
    </style>
    
    <!-- Gradients -->
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0EA5E9" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A855F7" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F43F5E" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="700" fill="#F8FAFC" rx="28" />

  <!-- Outer Frame -->
  <rect x="25" y="25" width="1150" height="650" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" class="shadow" />

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" font-size="28" font-weight="800" fill="#0F172A">User Workflow</text>
  <text x="600" y="98" text-anchor="middle" font-size="13" font-weight="500" fill="#64748B">SkillBridge • End-to-End Collaboration, Verification &amp; Deterministic Matching Engine</text>

  <!-- ==================== ROW 1: 7 SEQUENTIAL CARDS ==================== -->
  
  <!-- Step 1: User Registration -->
  <g transform="translate(45, 125)">
    <rect width="145" height="155" rx="16" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" class="card-shadow" />
    <circle cx="72.5" cy="28" r="14" fill="#0284C7" />
    <text x="72.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">1</text>
    <!-- User Icon -->
    <path d="M72.5 56 a9 9 0 1 0 0 -18 a9 9 0 0 0 0 18 z M60 76 c0 -8.2 8.3 -10 12.5 -10 s12.5 1.8 12.5 10 z" fill="#0284C7" />
    <circle cx="85" cy="52" r="6" fill="#0369A1" />
    <path d="M85 49 v6 M82 52 h6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
    <text x="72.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">User</text>
    <text x="72.5" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Registration</text>
    <text x="72.5" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">Role Onboarding</text>
  </g>

  <!-- Horizontal connector arrow 1 -> 2 -->
  <path d="M 193 202 L 206 202" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Skill Assessment -->
  <g transform="translate(208, 125)">
    <rect width="145" height="155" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" class="card-shadow" />
    <circle cx="72.5" cy="28" r="14" fill="#16A34A" />
    <text x="72.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">2</text>
    <!-- Brain / Radar Assessment Icon -->
    <path d="M60 48 C 60 44, 68 40, 72.5 44 C 77 40, 85 44, 85 48 C 88 52, 87 62, 82 66 L 72.5 73 L 63 66 C 58 62, 57 52, 60 48 Z" fill="#15803D" />
    <text x="72.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Skill</text>
    <text x="72.5" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Assessment</text>
    <text x="72.5" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">7-Axis Radar Profiling</text>
  </g>

  <!-- Horizontal connector arrow 2 -> 3 -->
  <path d="M 356 202 L 369 202" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Credential Issuance -->
  <g transform="translate(371, 125)">
    <rect width="145" height="155" rx="16" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1.5" class="card-shadow" />
    <circle cx="72.5" cy="28" r="14" fill="#9333EA" />
    <text x="72.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">3</text>
    <!-- Certificate Icon -->
    <rect x="58" y="42" width="29" height="34" rx="3" fill="none" stroke="#7E22CE" stroke-width="2.5" />
    <circle cx="72.5" cy="55" r="5" fill="#7E22CE" />
    <path d="M67 65 L 72.5 69 L 78 65" stroke="#7E22CE" stroke-width="2" fill="none" />
    <text x="72.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Credential</text>
    <text x="72.5" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Issuance</text>
    <text x="72.5" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">DigiLocker NAD Sync</text>
  </g>

  <!-- Horizontal connector arrow 3 -> 4 -->
  <path d="M 519 202 L 532 202" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: Role / Skill Matching -->
  <g transform="translate(534, 125)">
    <rect width="145" height="155" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" class="card-shadow" />
    <circle cx="72.5" cy="28" r="14" fill="#D97706" />
    <text x="72.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">4</text>
    <!-- Match Engine / People Icon -->
    <circle cx="72.5" cy="48" r="7" fill="#B45309" />
    <path d="M62 68 c0 -6 5 -8 10.5 -8 s10.5 2 10.5 8 z" fill="#B45309" />
    <circle cx="57" cy="52" r="5" fill="#D97706" />
    <circle cx="88" cy="52" r="5" fill="#D97706" />
    <text x="72.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Role &amp; Skill</text>
    <text x="72.5" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Matching</text>
    <text x="72.5" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">Deterministic Fit Engine</text>
  </g>

  <!-- Horizontal connector arrow 4 -> 5 -->
  <path d="M 682 202 L 695 202" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5: Asset Assignment -->
  <g transform="translate(697, 125)">
    <rect width="145" height="155" rx="16" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5" class="card-shadow" />
    <circle cx="72.5" cy="28" r="14" fill="#E11D48" />
    <text x="72.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">5</text>
    <!-- Laptop / ATS Icon -->
    <rect x="58" y="44" width="29" height="19" rx="2" fill="none" stroke="#BE123C" stroke-width="2.5" />
    <path d="M52 66 h41" stroke="#BE123C" stroke-width="3" stroke-linecap="round" />
    <text x="72.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Asset</text>
    <text x="72.5" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Assignment</text>
    <text x="72.5" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">ATS Kanban &amp; Projects</text>
  </g>

  <!-- Horizontal connector arrow 5 -> 6 -->
  <path d="M 845 202 L 858 202" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 6: Access & Portals -->
  <g transform="translate(860, 125)">
    <rect width="145" height="155" rx="16" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" class="card-shadow" />
    <circle cx="72.5" cy="28" r="14" fill="#2563EB" />
    <text x="72.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">6</text>
    <!-- Shield Icon -->
    <path d="M72.5 40 L 86 45 C 86 58, 77 67, 72.5 70 C 68 67, 59 58, 59 45 Z" fill="#1D4ED8" />
    <path d="M68 54 L 71 57 L 77 50" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="72.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Protected</text>
    <text x="72.5" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Access</text>
    <text x="72.5" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">JWT Secure Sessions</text>
  </g>

  <!-- Horizontal connector arrow 6 -> 7 -->
  <path d="M 1008 202 L 1021 202" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 7: Lifecycle Management -->
  <g transform="translate(1023, 125)">
    <rect width="132" height="155" rx="16" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5" class="card-shadow" />
    <circle cx="66" cy="28" r="14" fill="#0D9488" />
    <text x="66" y="33" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">7</text>
    <!-- Refresh / Cycle Icon -->
    <path d="M54 55 A 14 14 0 0 1 76 43 L 73 47 M 78 55 A 14 14 0 0 1 56 67 L 59 63" stroke="#0F766E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="66" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Lifecycle</text>
    <text x="66" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Management</text>
    <text x="66" y="142" text-anchor="middle" font-size="10" font-weight="500" fill="#64748B">Placement Velocity</text>
  </g>


  <!-- ==================== DOWNWARD ARROWS ==================== -->
  <line x1="117" y1="285" x2="117" y2="335" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow-sky)" />
  <line x1="280" y1="285" x2="280" y2="335" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)" />
  <line x1="443" y1="285" x2="443" y2="335" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple)" />
  <line x1="606" y1="285" x2="606" y2="335" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)" />
  <line x1="770" y1="285" x2="770" y2="335" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow-rose)" />
  <line x1="932" y1="285" x2="932" y2="335" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="1089" y1="285" x2="1089" y2="335" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)" />


  <!-- ==================== ROW 2: MIDDLE HUB CONTAINER ==================== -->
  <g transform="translate(45, 345)">
    <rect width="1110" height="95" rx="18" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="2" class="card-shadow" />
    
    <!-- 3D Node / Hub Icon -->
    <g transform="translate(25, 20)">
      <rect width="55" height="55" rx="14" fill="url(#hubGrad)" />
      <!-- Three interconnected nodes -->
      <circle cx="27.5" cy="18" r="4.5" fill="#FFFFFF" />
      <circle cx="17.5" cy="37" r="4.5" fill="#FFFFFF" />
      <circle cx="37.5" cy="37" r="4.5" fill="#FFFFFF" />
      <line x1="27.5" y1="18" x2="17.5" y2="37" stroke="#FFFFFF" stroke-width="2" />
      <line x1="27.5" y1="18" x2="37.5" y2="37" stroke="#FFFFFF" stroke-width="2" />
      <line x1="17.5" y1="37" x2="37.5" y2="37" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- Hub Texts -->
    <text x="98" y="46" font-size="18" font-weight="800" fill="#1E1B4B">Integration &amp; Verification Hub (DigiLocker NAD Engine)</text>
    <rect x="580" y="30" width="180" height="22" rx="11" fill="#EDE9FE" />
    <text x="670" y="45" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">LIVE WEBHOOK SYNC</text>
    
    <text x="98" y="70" font-size="12" font-weight="500" fill="#4B5563">
      Cryptographically verify marksheet hashes, SWAYAM/NPTEL certificates, HackerRank ratings &amp; Institutional ERP SIS rosters.
    </text>
  </g>


  <!-- ==================== DUAL CONNECTING ARROWS ==================== -->
  <g transform="translate(290, 442)">
    <line x1="0" y1="4" x2="0" y2="32" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="0" y1="32" x2="0" y2="4" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)" />
  </g>
  <g transform="translate(850, 442)">
    <line x1="0" y1="4" x2="0" y2="32" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="0" y1="32" x2="0" y2="4" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)" />
  </g>


  <!-- ==================== ROW 3: TWO SIDE-BY-SIDE CARDS ==================== -->
  
  <!-- Left: Off-Chain Storage / Database Layer -->
  <g transform="translate(45, 480)">
    <rect width="540" height="92" rx="16" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5" class="card-shadow" />
    <!-- Database Cylinder Icon -->
    <g transform="translate(22, 18)">
      <circle cx="26" cy="26" r="24" fill="#FFE4E6" />
      <ellipse cx="26" cy="17" rx="13" ry="5" fill="#E11D48" />
      <path d="M13 17 v12 c0 2.8 5.8 5 13 5 s13 -2.2 13 -5 v-12 z" fill="#BE123C" />
      <path d="M13 23 c0 2.8 5.8 5 13 5 s13 -2.2 13 -5" fill="none" stroke="#FDA4AF" stroke-width="1.5" />
    </g>
    <text x="88" y="44" font-size="16" font-weight="800" fill="#881337">Database Layer (Off-Chain)</text>
    <text x="88" y="66" font-size="12" font-weight="500" fill="#4B5563">MongoDB Database • Encrypted Profiles, Resumes &amp; ATS Pipelines</text>
  </g>

  <!-- Right: Application Layer -->
  <g transform="translate(615, 480)">
    <rect width="540" height="92" rx="16" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" class="card-shadow" />
    <!-- Application / Monitor Icon -->
    <g transform="translate(22, 18)">
      <circle cx="26" cy="26" r="24" fill="#E0F2FE" />
      <rect x="15" y="16" width="22" height="15" rx="2" fill="none" stroke="#0284C7" stroke-width="2" />
      <path d="M22 34 h8 M26 31 v3" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="88" y="44" font-size="16" font-weight="800" fill="#0C4A6E">Application Layer</text>
    <text x="88" y="66" font-size="12" font-weight="500" fill="#4B5563">Frontend (React 18 + Vite) | Backend (Node.js + Express REST APIs)</text>
  </g>


  <!-- ==================== ROW 4: BOTTOM PILLARS GREEN BAR ==================== -->
  <g transform="translate(45, 595)">
    <rect width="1110" height="52" rx="16" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" />
    
    <g transform="translate(100, 31)">
      <circle cx="0" cy="-4" r="4" fill="#16A34A" />
      <text x="14" y="0" font-size="13" font-weight="700" fill="#14532D">Secure Identities</text>
    </g>

    <text x="350" y="32" font-size="14" fill="#86EFAC">•</text>

    <g transform="translate(400, 31)">
      <circle cx="0" cy="-4" r="4" fill="#16A34A" />
      <text x="14" y="0" font-size="13" font-weight="700" fill="#14532D">Trusted Access</text>
    </g>

    <text x="610" y="32" font-size="14" fill="#86EFAC">•</text>

    <g transform="translate(660, 31)">
      <circle cx="0" cy="-4" r="4" fill="#16A34A" />
      <text x="14" y="0" font-size="13" font-weight="700" fill="#14532D">Tamper-Proof Records</text>
    </g>

    <text x="890" y="32" font-size="14" fill="#86EFAC">•</text>

    <g transform="translate(940, 31)">
      <circle cx="0" cy="-4" r="4" fill="#16A34A" />
      <text x="14" y="0" font-size="13" font-weight="700" fill="#14532D">Deterministic Fit</text>
    </g>
  </g>

</svg>
